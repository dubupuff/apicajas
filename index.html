<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO'S DUBUPUFF</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos Globales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #FFE5DF; /* Fondo rosa solicitado */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60"><path d="M15 5l1.2 2.5 2.8.4-2 2 1.3 2.6-2.3-1.5-2.3 1.5 1.3-2.6-2-2 2.8-.4L15 5zm30 30l.8 1.7 1.9.3-1.4 1.3.9 1.8-1.6-1-1.6 1 .9-1.8-1.4-1.3 1.9-.3.8-1.7zm5-20l.5 1 .9.2-.7.7.4 1-.8-.5-.8.5.4-1-.7-.7.9-.2.5-1z" fill="%23FFFFFF" fill-opacity="0.6"/></svg>');
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Principal (Estilo Carrd) */
        .portal-container {
            background-color: #ffffff;
            max-width: 550px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 32px;
            box-shadow: 0 12px 35px rgba(255, 117, 143, 0.2);
            border: 5px dotted #FFB6C1; /* Borde de puntos redondos solicitado */
            text-align: center;
            position: relative;
        }

        /* Imagen de Jigglypuff Pixel Art con animación de flotación */
        .jiggly-avatar {
            width: 75px;
            height: auto;
            margin-bottom: 12px;
            image-rendering: pixelated; /* Mantiene los píxeles nítidos */
            display: inline-block;
            animation: floatEffect 3s ease-in-out infinite;
        }

        @keyframes floatEffect {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        /* Título Principal con estrellitas */
        h1.main-title {
            font-size: 32px;
            color: #FF5C8A; /* Rosa fuerte vibrante */
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }
        h1.main-title::before { content: "✨ "; }
        h1.main-title::after { content: " ✨"; }

        /* Barra de Navegación Superior */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 35px;
            flex-wrap: wrap; /* Soporte para celulares */
        }

        .tab-button {
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid #FFE4E1;
            background-color: #FFF5F6;
            color: #FF758F;
            flex: 1;
            min-width: 105px;
            white-space: nowrap;
        }

        /* Pestaña activa en tonos rosa de contraste */
        .tab-button.active {
            background-color: #FFB6C1;
            color: #FFFFFF;
            border-color: #FFA4B2;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08);
        }

        /* Secciones de Contenido */
        .page-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .page-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Menú de Botones Internos de Inicio */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 320px;
            margin: 0 auto;
        }

        .btn-link {
            background: none;
            color: #FF5C8A;
            border: none;
            font-size: 18px;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 4px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }
        .btn-link:hover {
            color: #D63E6B;
        }

        /* Estilos de los Cotizadores e Inputs */
        .input-group {
            margin-bottom: 20px;
            text-align: center;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .subtitulo {
            font-size: 14px;
            color: #7A6F71;
            font-weight: 500;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #FF8FA3;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 18px;
            border: 2px solid #FFE4E1;
            border-radius: 12px;
            outline: none;
            color: #4A3E41;
            background-color: #FFFAFB;
            text-align: center;
        }

        input[type="number"]:focus {
            border-color: #FFB6C1;
            box-shadow: 0 0 0 4px rgba(255, 182, 193, 0.4);
            background-color: #ffffff;
        }

        .total-box {
            font-size: 32px;
            font-weight: 700;
            color: #FF5C8A;
            margin: 20px 0;
            min-height: 40px;
        }

        .mensaje-final {
            font-size: 13px;
            color: #7A6F71;
            font-weight: 500;
            line-height: 1.5;
            border-top: 1px dashed #FFE4E1;
            padding-top: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .info-texto {
            font-size: 14px;
            color: #4A3E41;
            line-height: 1.6;
            text-align: left;
            max-width: 420px;
            margin: 15px auto 0 auto;
            background-color: #FFF9FA;
            padding: 20px;
            border-radius: 16px;
            border: 1px dashed #FFE4E1;
        }

        /* Contenedor para la sección de enlaces externos */
        .external-links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 380px;
            margin: 20px auto 0 auto;
        }

        .btn-external {
            display: block;
            width: 100%;
            padding: 15px 20px;
            font-size: 15px;
            font-weight: 700;
            color: #FF5C8A;
            background-color: #FFF5F6;
            border: 2px solid #FFE4E1;
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.15);
        }

        .btn-external:hover {
            background-color: #FFB6C1;
            color: #FFFFFF;
            border-color: #FFA4B2;
            transform: translateY(-2px);
        }

        /* Eliminar flechas de los inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>

            <button class="tab-button" id="tab-links" onclick="cambiarPagina('page-links', 'tab-links')">Links útiles</button>

        <div class="page-content active" id="page-inicio">
            <div class="menu-grid">
