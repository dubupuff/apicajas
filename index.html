        /* Estilos Globales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Principal (Home) */
        .portal-container {
            background-color: #ffffff;
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(255, 182, 193, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            color: #111827;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitulo {
            font-size: 14px;
            color: #555555;
            font-weight: 500;
            margin-bottom: 30px;
        }

        /* Menú de Botones Principales */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-menu {
            background-color: #fff5f6;
            color: #ff758f;
            border: 2px solid #ffe4e1;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-menu:hover {
            background-color: #ff758f;
            color: #ffffff;
            border-color: #ff758f;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 117, 143, 0.3);
        }

        /* Estilos de los Pop-ups (Modals) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 229, 223, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        /* Botón Cerrar (X) */
        .btn-cerrar {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-weight: 700;
            transition: color 0.2s;
        }

        .btn-cerrar:hover {
            color: #ff758f;
        }

        /* Estilos internos de los Cotizadores */
        .input-group {
            margin-bottom: 20px;
            text-align: center;
        }
