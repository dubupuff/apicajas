        /* Estilos Globales Estables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {

        /* Contenedor Principal Fijo (Tu hermosa tarjeta blanca estilo Carrd) */
        .portal-container {
            background-color: #ffffff !important;
            max-width: 550px !important;
            width: 100% !important;
            padding: 40px 30px;
            border-radius: 32px;
            box-shadow: 0 12px 35px rgba(255, 117, 143, 0.2);
            border: 5px dotted #FFB6C1; /* Tu borde de puntos redondos solicitado */
            text-align: center;
            display: block !important; /* Evita que la tarjeta desaparezca por completo */
        }

        /* Tu avatar animado de Jigglypuff */
        .jiggly-avatar {
            width: 75px;
            height: auto;
            margin-bottom: 12px;
            display: inline-block;
            animation: floatEffect 3s ease-in-out infinite;
        }

        @keyframes floatEffect {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        /* Título Principal con estrellitas */
        h1.main-title {
            font-size: 32px;
            color: #FF5C8A; /* Rosa fuerte vibrante */
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }
        h1.main-title::before { content: "✨ "; }
        h1.main-title::after { content: " ✨"; }

        /* Barra de Navegación Superior */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 35px;
            flex-wrap: wrap; /* Excelente adaptación para celulares */
        }

        .tab-button {
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid #FFE4E1;
            background-color: #FFF5F6;
            color: #FF758F;
            flex: 1;
            min-width: 105px;
            white-space: nowrap;
        }

        /* Pestaña activa en tus tonos rosa de contraste */
        .tab-button.active {
            background-color: #FFB6C1 !important;
            color: #FFFFFF !important;
            border-color: #FFA4B2 !important;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08);
        }

        /* Secciones de Contenido */
        .page-content {
            display: none;
        }

        .page-content.active {
            display: block !important;
        }

        /* Menú de Botones Internos de Inicio */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 320px;
            margin: 0 auto;
        }

        .btn-link {
            background: none;
            color: #FF5C8A;
            border: none;
            font-size: 18px;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 4px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }
        .btn-link:hover {
            color: #D63E6B;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: center;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
