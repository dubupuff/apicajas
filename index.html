<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUBUPUFF CASILLA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos Globales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #FFE5DF; /* Color de fondo rosa */

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Principal (Estilo Carrd) */
        .portal-container {
            background-color: #ffffff;
            max-width: 550px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 32px;
            box-shadow: 0 12px 35px rgba(255, 117, 143, 0.2);
            border: 4px dashed #FFB6C1; /* Borde punteado rosa */
            text-align: center;
            position: relative;
        }

        /* Título Principal con estrellitas */
        h1.main-title {
            font-size: 32px;
            color: #FF5C8A; /* Rosa fucsia suave */
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }
        h1.main-title::before { content: "✨ "; }
        h1.main-title::after { content: " ✨"; }

        /* Barra de Navegación Superior */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .tab-button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid #FFE4E1;
            background-color: #FFF5F6;
            color: #FF758F;
            flex: 1;
            max-width: 145px;
            white-space: nowrap;
        }

        /* Pestaña activa en tonos rosa de contraste */
        .tab-button.active {
            background-color: #FFB6C1;
            color: #FFFFFF;
            border-color: #FFA4B2;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08);
        }

        /* Secciones de Contenido */
        .page-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .page-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Menú de Botones Internos de Inicio */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 320px;
            margin: 0 auto;
        }

        .btn-link {
            background: none;
            color: #FF5C8A;
            border: none;
            font-size: 18px;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 4px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }
        .btn-link:hover {
            color: #D63E6B;
        }

        /* Estilos de los Cotizadores */
        .input-group {
            margin-bottom: 20px;
            text-align: center;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .subtitulo {
            font-size: 14px;
            color: #7A6F71;
            font-weight: 500;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #FF8FA3;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 18px;
